name: build on: push: branches: [main] tags: ["v*"] pull_request: branches: [main] workflow_dispatch: env: CARGO_TERM_COLOR: always jobs: build: name: ${{ matrix.target }} runs-on: ${{ 
    matrix.os }} strategy:
      fail-fast: false matrix: include: - target: x86_64-unknown-linux-gnu os: ubuntu-latest artifact: libnostd_proto.so use_cross: false - target: aarch64-unknown-linux-gnu os: 
            ubuntu-latest artifact: libnostd_proto.so use_cross: true
          - target: x86_64-pc-windows-gnu os: ubuntu-latest artifact: nostd_proto.dll use_cross: true - target: aarch64-pc-windows-msvc os: windows-latest artifact: nostd_proto.dll 
            use_cross: false
    steps: - name: Checkout uses: actions/checkout@v4 - name: Install rust toolchain uses: dtolnay/rust-toolchain@stable with: targets: ${{ matrix.target }} - name: Cache cargo uses: 
        Swatinem/rust-cache@v2 with:
          key: ${{ matrix.target }} - name: Install cross if: matrix.use_cross run: cargo install cross --git https://github.com/cross-rs/cross --locked - name: Build (cross) if: 
        matrix.use_cross run: cross build --release --target ${{ matrix.target }}
      - name: Build (cargo) if: ${{ !matrix.use_cross }} run: cargo build --release --target ${{ matrix.target }} - name: Upload artifact uses: actions/upload-artifact@v4 with: name: ${{ 
          matrix.target }} path: target/${{ matrix.target }}/release/${{ matrix.artifact }} if-no-files-found: error
  release: name: Release needs: build if: startsWith(github.ref, 'refs/tags/v') runs-on: ubuntu-latest steps: - name: Download all artifacts uses: actions/download-artifact@v4 with: 
          path: dist
      - name: Flatten and rename run: | mkdir -p out for dir in dist/*/; do target=$(basename "$dir") for f in "$dir"*; do fname=$(basename "$f") cp "$f" 
              "out/${fname%.*}-${target}.${fname##*.}"
            done done ls -la out - name: Create GitHub release uses: softprops/action-gh-release@v2 with: files: out/*
          generate_release_notes: true
